name: Build YouTube VPN APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

concurrency:
  group: youtubevpn-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and verify debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Check toolchain
        run: |
          java -version
          gradle --version
          sdkmanager --list_installed

      - name: Build APK
        run: gradle --no-daemon --stacktrace clean assembleDebug

      - name: Verify APK archive and package
        run: |
          test -s app/build/outputs/apk/debug/app-debug.apk
          unzip -t app/build/outputs/apk/debug/app-debug.apk
          aapt dump badging app/build/outputs/apk/debug/app-debug.apk | grep -F "package: name='com.potapych.youtubevpn'"

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: YouTubeVPN-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
